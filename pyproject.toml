[build-system]
requires = ["setuptools==84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-x-ray-risk"
version = "2.2.0"
description = "Known-risks knowledge base (ChromaDB vector search) for x-ray"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
  "mongo-x-ray>=2.0.0",
  "chromadb==1.5.9",
]

[project.entry-points."mongo_x_ray.plugins"]
ingest = "mongo_x_ray_risk.plugin:IngestPlugin"
search = "mongo_x_ray_risk.plugin:SearchPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mongo_x_ray_risk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mongo_x_ray", "mongo_x_ray_ftdc", "mongo_x_ray_gmd", "mongo_x_ray_hc", "mongo_x_ray_log", "mongo_x_ray_risk"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "../ce-mongo-x-ray"
venv = ".venv"
typeCheckingMode = "basic"
extraPaths = [
  "src",
  "../ce-mongo-x-ray/src",
]
